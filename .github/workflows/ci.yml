name: OpsTwin Live DevSecOps CI

on:
push:
pull_request:
workflow_dispatch:

permissions:
contents: read

jobs:
backend-tests:
name: Backend Tests
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4

```
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: pip
      cache-dependency-path: backend/requirements-dev.txt

  - name: Install backend dependencies
    working-directory: backend
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements-dev.txt

  - name: Run backend tests
    working-directory: backend
    run: python -m pytest -q
```

frontend-checks:
name: Frontend Checks
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4

```
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: npm
      cache-dependency-path: frontend/package-lock.json

  - name: Install frontend dependencies
    working-directory: frontend
    run: npm ci

  - name: Type check
    working-directory: frontend
    run: npm run typecheck

  - name: Run frontend tests
    working-directory: frontend
    run: npm test

  - name: Build frontend
    working-directory: frontend
    run: npm run build
```

python-security:
name: Python Security Scans
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4

```
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install scanning tools
    run: |
      python -m pip install --upgrade pip
      pip install bandit pip-audit

  - name: Scan Python source with Bandit
    run: bandit -r backend/app -ll -f txt
    continue-on-error: true

  - name: Audit Python dependencies
    run: pip-audit -r backend/requirements.txt
    continue-on-error: true
```

frontend-security:
name: Frontend Dependency Audit
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4

```
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Install frontend dependencies
    working-directory: frontend
    run: npm ci

  - name: Audit npm dependencies
    working-directory: frontend
    run: npm audit --audit-level=high
    continue-on-error: true
```

container-security:
name: Docker Build and Trivy Scan
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4

```
  # Configure these two repository secrets to enable Docker Hub login.
  - name: Log in to Docker Hub
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Build backend image
    uses: docker/build-push-action@v6
    with:
      context: ./backend
      push: false
      load: true
      tags: opstwin-backend:ci
      cache-from: type=gha,scope=backend
      cache-to: type=gha,mode=max,scope=backend

  - name: Build frontend image
    uses: docker/build-push-action@v6
    with:
      context: ./frontend
      push: false
      load: true
      tags: opstwin-frontend:ci
      cache-from: type=gha,scope=frontend
      cache-to: type=gha,mode=max,scope=frontend

  - name: Scan backend image with Trivy
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: opstwin-backend:ci
      format: table
      severity: HIGH,CRITICAL
      exit-code: "0"

  - name: Scan frontend image with Trivy
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: opstwin-frontend:ci
      format: table
      severity: HIGH,CRITICAL
      exit-code: "0"
```
